<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Yeseva One' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Nunito Sans' rel='stylesheet'>
    <title>Слайдер на JS</title>
</head>
<body>
<main>
    <section class="slider">
        <div class="slider__cities"></div>
        <div class="slider__container">
            <div class="slider__description">
                <div class="slider__block_1 text-project">Completed <br> projects <svg class="line" width="92" height="1" viewBox="0 0 92 1" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="-0.00012207" y="-0.00012207" width="92" height="1" fill="#E3B873"/>
                </svg>
                </div>
                <div class="slider__block_2 par">Only a small part of the work performed by our company is presented on the site.
                    For 14 years on in the construction market we have made happy more than 1000 families</div>
                <div class="slider__block_3">
                    <div class="slider__info city">
                        <div class="text-info">City:</div>
                    </div>
                    <div class="slider__info apartment">
                        <div class="text-info">apartment area:</div>
                    </div>
                    <div class="slider__info time">
                        <div class="text-info">Repair time:</div>
                    </div>
                    <div class="slider__info cost">
                        <div class="text-info">Repair Cost:</div>
                        <div class="par">Upon request</div>
                    </div>
                </div>
                <div class="slider__arrows">
                    <button class="slider__arrow left"><svg width="42" height="14" viewBox="0 0 42 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M6.63807 13.276L2.29917e-05 6.638L6.63807 -3.82298e-05L7.58563 0.94753L1.89516 6.638L7.58563 12.3285L6.63807 13.276Z" fill="white"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M0.947579 5.9681L41.4556 5.9681L41.4556 7.30817L0.947578 7.30816L0.947579 5.9681Z" fill="white"/>
                    </svg></button>
                    <div class="slider__dots"></div>
                    <button class="slider__arrow right"><svg width="42" height="14" viewBox="0 0 42 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M35.0451 -0.000183105L41.6831 6.63786L35.0451 13.2759L34.0975 12.3283L39.788 6.63786L34.0975 0.947384L35.0451 -0.000183105Z" fill="white"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M40.7355 7.30776L0.227539 7.30776L0.227539 5.9677L40.7355 5.9677L40.7355 7.30776Z" fill="white"/>
                    </svg>
                    </button>
                </div>
            </div>
            <div class="slider__images"></div>
        </div>
    </section>
    <script src="script.js"></script>
</main>
</body>
</html>
